services:
  - type: web
    name: jas1-server
    env: node
    region: oregon
    buildCommand: npm --prefix server install
    startCommand: npm --prefix server start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: https://jas1-server.onrender.com

  - type: web
    name: jas1-client
    env: static
    region: oregon
    buildCommand: npm --prefix client install && npm --prefix client run build
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_API_URL
        value: https://jas1-server.onrender.com/api
